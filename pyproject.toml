[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentraffic-tsc-engine"
version = "1.0.0"
description = "OpenTraffic TSC Engine - 面向智能交通信号控制的开源 SDK"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenTraffic Team"}
]
keywords = ["traffic", "signal", "control", "cityflow", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "torch>=1.10.0",
    "redis>=4.0.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
# CityFlow 需要 CMake + Boost 系统依赖，不能自动安装。
# 安装方式：pip install ./CityFlow/
cityflow = []
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "Cython>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenTraffic-Team/opentraffic-tsc-engine"
Repository = "https://github.com/OpenTraffic-Team/opentraffic-tsc-engine"
Issues = "https://github.com/OpenTraffic-Team/opentraffic-tsc-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["algorithms", "algorithms.*", "algorithms_sdk", "algorithms_sdk.*"]
exclude = [
    "algorithms_so*",
    "build*",
    "CityFlow*",
    "config*",
    "docs*",
    "frontend*",
    "modules*",
    "real_test*",
    "replay*",
    "skills*",
]

[tool.setuptools.package-data]
algorithms = ["**/*.so"]
algorithms_sdk = ["**/*.so"]
