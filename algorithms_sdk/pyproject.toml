[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms_sdk"
version = "1.0.0"
description = "交通信号控制算法SDK - 支持CityFlow/SUMO仿真和生产环境"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Traffic Control Team", email = "team@example.com"}
]
keywords = ["traffic", "signal", "control", "cityflow", "sumo", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
    "redis>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/algorithms-sdk"
Documentation = "https://algorithms-sdk.readthedocs.io"
Repository = "https://github.com/example/algorithms-sdk"
Issues = "https://github.com/example/algorithms-sdk/issues"

[project.scripts]
# algorithm-sdk = "algorithms_sdk.cli:main"  # 待实现 CLI

[tool.setuptools.packages.find]
where = ["."]
include = ["algorithms_sdk*"]
exclude = ["examples*", "docs*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
